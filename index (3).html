<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italian Family Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f6f1;--surface:#fff;--surface2:#f2efe8;--surface3:#e8e4db;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --ink:#18160f;--ink2:#4a4438;--ink3:#9a9080;--ink4:#ccc4b4;
  --gold:#b8883a;--gold-bg:#fdf5e8;--gold-border:rgba(184,136,58,0.3);
  --serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --r:10px;--rl:14px;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);}

/* TOP BAR */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:200;
  background:var(--ink);
  display:flex;align-items:center;gap:14px;padding:0 1.5rem;
}
.logo{font-family:var(--serif);font-size:19px;color:#fff;white-space:nowrap;flex-shrink:0;}
.logo em{color:#c8a45a;font-style:italic;}
.sep{width:1px;height:20px;background:rgba(255,255,255,.14);flex-shrink:0;}
.search-box{position:relative;flex:1;max-width:260px;}
.search-box input{
  width:100%;height:30px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:6px;
  color:#fff;font-family:var(--sans);font-size:12px;
  padding:0 10px 0 28px;outline:none;transition:background .15s;
}
.search-box input:focus{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.32);}
.search-box input::placeholder{color:rgba(255,255,255,.3);}
.search-ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:13px;pointer-events:none;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.stat-chip{font-size:11px;color:rgba(255,255,255,.35);white-space:nowrap;}

/* LAYOUT */
.layout{display:flex;height:100vh;padding-top:52px;}

/* SIDEBAR */
.sidebar{
  width:248px;flex-shrink:0;height:100%;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--border);
}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--surface3);}
.sb-hd{padding:.875rem 1.125rem .625rem;border-bottom:1px solid var(--border);}
.sb-hd h2{font-family:var(--serif);font-size:14px;font-weight:400;color:var(--ink2);}
.sb-hd p{font-size:10px;color:var(--ink3);margin-top:2px;}

.fam-row{
  display:flex;align-items:center;gap:9px;
  padding:7px 1.125rem;cursor:pointer;
  transition:background .1s;border-left:3px solid transparent;
}
.fam-row:hover{background:var(--surface2);}
.fam-row.active{background:var(--gold-bg);border-left-color:var(--gold);}
.fam-crest{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:12px;font-weight:600;
}
.fam-nm{font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.fam-geo{font-size:9.5px;color:var(--ink3);}
.fam-cnt{font-size:10px;color:var(--ink3);flex-shrink:0;}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.main::-webkit-scrollbar{width:5px;}
.main::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}

/* HERO */
.hero{
  padding:2rem 2.5rem 1.625rem;color:#fff;
  position:relative;overflow:hidden;flex-shrink:0;
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,.18) 0,transparent 60%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;}
.hero-name{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1.1;letter-spacing:-.01em;}
.hero-name em{font-style:italic;opacity:.75;}
.hero-sub{font-size:12px;opacity:.5;margin-top:4px;font-weight:300;}
.hero-kpis{
  display:flex;gap:2rem;flex-wrap:wrap;
  margin-top:1.25rem;padding-top:1rem;
  border-top:1px solid rgba(255,255,255,.12);
}
.kpi-val{font-size:24px;font-weight:300;line-height:1;}
.kpi-lbl{font-size:9px;opacity:.4;margin-top:3px;text-transform:uppercase;letter-spacing:.08em;}
.hero-assets{font-size:11px;opacity:.45;margin-top:.75rem;font-weight:300;}

/* CONTENT AREA */
.content{padding:1.75rem 2.5rem 3rem;flex:1;}

/* METRICS ROW */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.75rem;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.875rem 1rem;}
.metric .mv{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--ink);line-height:1;}
.metric .ml{font-size:9.5px;color:var(--ink3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
.metric .ms{font-size:11px;color:var(--ink2);margin-top:5px;}

/* GENERATION SECTIONS */
.gen-section{margin-bottom:2rem;}
.gen-heading{
  display:flex;align-items:center;gap:12px;
  margin-bottom:1rem;
}
.gen-num{
  font-family:var(--serif);font-size:13px;font-weight:400;
  color:var(--ink3);
  border:1px solid var(--border2);
  border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.gen-title{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--ink2);}
.gen-count{font-size:11px;color:var(--ink3);margin-left:auto;}
.gen-rule{flex:1;height:1px;background:var(--border);}

/* PERSON CARDS GRID */
.cards-grid{
  display:flex;flex-wrap:wrap;gap:10px;
}

/* PERSON CARD */
.pcard{
  width:130px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:12px 10px 10px;
  cursor:pointer;
  position:relative;
  transition:transform .16s,border-color .16s,box-shadow .16s;
}
.pcard:hover{transform:translateY(-2px);border-color:var(--gold-border);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,136,58,.15),0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px);}
.pcard.dim{opacity:.2;pointer-events:none;}
.pcard.hl{border-color:var(--gold-border);background:var(--gold-bg);}
.pcard.sp-card{background:var(--surface2);}
.pcard .dag{position:absolute;top:5px;right:7px;font-size:9px;color:var(--ink4);}

.pcard-av{
  width:36px;height:36px;border-radius:50%;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;font-weight:600;
}
.pcard-first{font-family:var(--serif);font-size:13px;color:var(--ink);line-height:1.2;text-align:center;}
.pcard-sur{font-size:9.5px;color:var(--ink3);margin-top:2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard-year{font-size:9px;color:var(--ink4);margin-top:3px;text-align:center;}
.pcard-branch{
  display:inline-block;margin-top:5px;
  font-size:8px;padding:1px 6px;border-radius:8px;
  font-weight:500;white-space:nowrap;
}
.pcard-rel{
  position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  font-size:8px;color:var(--ink3);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;
  padding:1px 6px;white-space:nowrap;
}

/* marriage connector between two cards */
.couple-wrap{display:inline-flex;align-items:center;gap:0;vertical-align:top;}
.m-line{width:12px;height:1.5px;background:var(--gold);flex-shrink:0;}
.m-ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg);flex-shrink:0;}

/* BRANCH BAR */
.branch-section{margin-top:1.75rem;}
.branch-section h3{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--ink2);margin-bottom:12px;}
.br{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.br-nm{font-size:12px;color:var(--ink2);width:120px;flex-shrink:0;}
.br-tr{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.br-fl{height:100%;border-radius:3px;}
.br-ct{font-size:11px;color:var(--ink3);width:22px;text-align:right;flex-shrink:0;}

/* DETAIL PANEL */
.dp{
  position:fixed;right:1.25rem;top:64px;width:256px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--rl);z-index:300;display:none;
  box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden;
}
.dp.open{display:block;}
.dp-hd{padding:.875rem 1rem .75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.dp-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;font-weight:600;}
.dp-nm{font-family:var(--serif);font-size:16px;line-height:1.2;color:var(--ink);}
.dp-sb{font-size:10px;color:var(--ink3);margin-top:2px;}
.dp-x{margin-left:auto;width:22px;height:22px;border-radius:5px;flex-shrink:0;border:1px solid var(--border);background:none;color:var(--ink3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dp-x:hover{background:var(--surface2);}
.dp-bd{padding:.75rem 1rem;}
.dp-r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;}
.dp-r:last-child{border:none;}
.dp-lb{color:var(--ink3);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;}
.dp-vl{color:var(--ink);font-weight:500;text-align:right;max-width:158px;}
.dp-lk{padding:.5rem 1rem .875rem;border-top:1px solid var(--border);}
.dp-lk-t{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.dp-lk-i{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:var(--ink2);cursor:pointer;transition:color .12s;}
.dp-lk-i:hover{color:var(--gold);}
.dp-lk-d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dp-lk-b{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:5px;background:var(--surface2);color:var(--ink3);}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink3);text-align:center;padding:3rem;}
.empty-icon{font-family:var(--serif);font-size:52px;color:var(--surface3);}
.empty p{font-size:13px;margin-top:10px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Italian <em>Family Archive</em></div>
  <div class="sep"></div>
  <div class="search-box">
    <span class="search-ico">⌕</span>
    <input type="text" id="s-in" placeholder="Search person or family…" oninput="onSearch(this.value)">

</div>

<div class="layout">

</div>

<div class="dp" id="dp">

</div>

function rgba(hex,a){
  if(!hex||hex.length<7) return `rgba(128,128,128,${a})`;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ── SELECT FAMILY ── */
function selectFam(id) {
  FAM = FAMILIES.find(f=>f.id===id);
  if (!FAM) return;
  selId = null;
  document.querySelectorAll('.fam-row').forEach(r=>r.classList.remove('active'));
  const sr = document.getElementById('sr-'+id);
  if (sr) { sr.classList.add('active'); sr.scrollIntoView({block:'nearest'}); }
  document.getElementById('dp').classList.remove('open');
  renderFamily();
}

/* ── GENERATION ASSIGNMENT ── */
function assignGens(fam) {
  const fm = {};
  fam.members.forEach(m => fm[m.id] = m);
  const gen = {};
  const children = {};
  fam.members.forEach(m => {
    [m.fid,m.mid].forEach(pid => {
      if (pid && fm[pid]) { if (!children[pid]) children[pid]=[]; children[pid].push(m.id); }
    });
  });
  // BFS from roots that have children (true ancestors)
  const q = [];
  fam.members.forEach(m => {
    const hasParent = (m.fid&&fm[m.fid])||(m.mid&&fm[m.mid]);
    if (!hasParent && (children[m.id]||[]).length>0) { gen[m.id]=1; q.push(m.id); }
  });
  while (q.length) {
    const id=q.shift();
    (children[id]||[]).forEach(cid=>{
      if (gen[cid]===undefined) { gen[cid]=gen[id]+1; q.push(cid); }
    });
  }
  // Spouses inherit their partner's generation
  let changed=true;
  while (changed) {
    changed=false;
    fam.members.forEach(m => {
      if (gen[m.id]!==undefined) return;
      const partners=[...(m.sp||[])];
      fam.members.forEach(o=>{ if((o.sp||[]).includes(m.id)) partners.push(o.id); });
      partners.forEach(sid=>{
        if (gen[sid]!==undefined && gen[m.id]===undefined) { gen[m.id]=gen[sid]; changed=true; }
      });
    });
  }
  fam.members.forEach(m=>{ if(gen[m.id]===undefined) gen[m.id]=1; });
  return gen;
}

/* ── RENDER FAMILY ── */
function renderFamily() {
  const f = FAM;
  const fm = {};
  f.members.forEach(m=>fm[m.id]=m);
  const genOf = assignGens(f);
  const maxGen = Math.max(...Object.values(genOf));
  const living = f.members.filter(m=>m.alive).length;

  // Assign branch colours to gen2 primaries
  const branchCol = {};
  const gen2 = f.members.filter(m=>genOf[m.id]===2&&((m.fid&&fm[m.fid])||(m.mid&&fm[m.mid])));
  gen2.forEach((m,i)=>branchCol[m.id]=BPAL[i%BPAL.length]);
  function getBCol(m) {
    if (branchCol[m.id]) return branchCol[m.id];
    const pid=m.fid||m.mid;
    if (pid&&fm[pid]) return getBCol(fm[pid]);
    return f.color;
  }

  // Distinct branches from data
  const branches=[...new Set(f.members.map(m=>m.branch).filter(Boolean))];
  const branchCounts={};
  branches.forEach(b=>branchCounts[b]=f.members.filter(m=>m.branch===b).length);
  const maxB=Math.max(...Object.values(branchCounts),1);

  // Group by gen
  const byGen={};
  for(let g=1;g<=maxGen;g++) byGen[g]=[];
  f.members.forEach(m=>byGen[genOf[m.id]].push(m));

  // Build generation sections HTML
  // Within each gen, group couples together
  const genRomans=['','I','II','III','IV','V','VI'];
  const genNames=['','Founders','Second generation','Third generation','Fourth generation','Fifth generation'];

  function mkCard(m, isSpouse) {
    const col = getBCol(m);
    const ini = ((m.first||'?')[0]+((m.sur||'').trim().split(' ').pop()[0]||'')).toUpperCase();
    const yr = m.dob ? m.dob.slice(0,4) : '';
    const branchColor = m.branch ? getBCol(m) : col;
    const spouseLabel = isSpouse ? `<span class="pcard-rel">Married in</span>` : '';
    return `<div class="pcard${isSpouse?' sp-card':''}" data-id="${m.id}" id="pc-${m.id}" onclick="onCard('${m.id}')">
      ${!m.alive?'<span class="dag">†</span>':''}
      <div class="pcard-av" style="background:${rgba(col,.16)};color:${col};">${ini}</div>
      <div class="pcard-first">${m.first||'?'}</div>
      <div class="pcard-sur">${(m.sur||'').split(' ').pop()}</div>
      ${yr?`<div class="pcard-year">${yr}</div>`:''}
      ${m.branch?`<div style="text-align:center;"><span class="pcard-branch" style="background:${rgba(branchColor,.14)};color:${branchColor};">${m.branch}</span></div>`:''}
      ${spouseLabel}
    </div>`;
  }

  function renderGen(g) {
    const members = byGen[g];
    if (!members||!members.length) return '';

    // For each member, figure out if they're a primary or a spouse
    // Render couples together: primary + their married-in spouses side by side
    const rendered = new Set();
    let cardsHtml = '';

    // Sort: primaries first (those with parents in fm), then others
    const primaries = members.filter(m=>(m.fid&&fm[m.fid])||(m.mid&&fm[m.mid])||(g===1&&(children_of(m).length>0)));
    const rest = members.filter(m=>!primaries.includes(m));

    function children_of(m){ return f.members.filter(x=>x.fid===m.id||x.mid===m.id); }

    // Spouses-in-same-gen of a primary
    function getSpouses(m) {
      return (m.sp||[])
        .map(sid=>fm[sid])
        .filter(s=>s&&genOf[s.id]===g&&!rendered.has(s.id)&&!((s.fid&&fm[s.fid])||(s.mid&&fm[s.mid])));
    }

    [...primaries,...rest].forEach(m=>{
      if (rendered.has(m.id)) return;
      rendered.add(m.id);
      const spList = getSpouses(m);
      spList.forEach(s=>rendered.add(s.id));

      if (spList.length) {
        cardsHtml += `<div class="couple-wrap">
          ${mkCard(m,false)}
          ${spList.map(sp=>`<div class="m-line"></div><div class="m-ring"></div><div class="m-line"></div>${mkCard(sp,true)}`).join('')}
        </div>`;
      } else {
        cardsHtml += mkCard(m, false);
      }
    });

    const title = genNames[g] || `Generation ${g}`;
    return `<div class="gen-section">
      <div class="gen-heading">
        <div class="gen-num">${genRomans[g]||g}</div>
        <div class="gen-title">${title}</div>
        <div class="gen-rule"></div>
        <div class="gen-count">${members.length} people</div>
      </div>
      <div class="cards-grid">${cardsHtml}</div>
    </div>`;
  }

  let genSections = '';
  for (let g=1;g<=maxGen;g++) genSections += renderGen(g);

  // Branch bars
  const branchBars = branches.map((b,i)=>`
    <div class="br">
      <div class="br-nm">${b}</div>
      <div class="br-tr"><div class="br-fl" style="width:${(branchCounts[b]/maxB*100).toFixed(0)}%;background:${BPAL[i%BPAL.length]};"></div></div>
      <div class="br-ct">${branchCounts[b]}</div>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="hero" style="background:${f.color};">
      <div class="hero-inner">
        <div class="hero-name">${f.name} <em>family</em></div>
        <div class="hero-sub">${f.geo}${f.surname?' · '+f.surname:''}</div>
        <div class="hero-kpis">
          <div><div class="kpi-val">${f.members.length}</div><div class="kpi-lbl">Members</div></div>
          <div><div class="kpi-val">${living}</div><div class="kpi-lbl">Living</div></div>
          <div><div class="kpi-val">${maxGen}</div><div class="kpi-lbl">Generations</div></div>
          <div><div class="kpi-val">${branches.length}</div><div class="kpi-lbl">Branches</div></div>
        </div>
        ${f.assets?`<div class="hero-assets">🏛 ${f.assets}</div>`:''}
      </div>
    </div>

    <div class="content">
      <div class="metrics">
        <div class="metric"><div class="mv">${f.members.length}</div><div class="ml">Total</div><div class="ms">family members</div></div>
        <div class="metric"><div class="mv">${living}</div><div class="ml">Living</div><div class="ms">${f.members.length-living} deceased</div></div>
        <div class="metric"><div class="mv">${maxGen}</div><div class="ml">Generations</div><div class="ms">recorded</div></div>
        <div class="metric"><div class="mv">${f.members.filter(m=>m.sp&&m.sp.length>0).length}</div><div class="ml">Couples</div><div class="ms">recorded</div></div>
      </div>

      ${genSections}

      ${branches.length?`<div class="branch-section"><h3>Members by branch</h3>${branchBars}</div>`:''}
    </div>
  `;

  applyHL();
}

/* ── CARD CLICK ── */
function onCard(id) {
  if (selId===id) { selId=null; closeDP(); return; }
  selId=id; applyHL(); openDP(id);
}

function applyHL() {
  document.querySelectorAll('.pcard').forEach(el=>{
    el.classList.remove('sel','dim','hl');
    if (!selId&&!searchQ) return;
    const id=el.dataset.id;
    if (searchQ) {
      const m=BYID[id]||{};
      const txt=((m.first||'')+' '+(m.sur||'')+' '+(m.familyName||'')).toLowerCase();
      el.classList.toggle('hl',txt.includes(searchQ));
      el.classList.toggle('dim',!txt.includes(searchQ));
    } else {
      const conn=getConn(selId);
      if(id===selId) el.classList.add('sel');
      else if(conn.has(id)) el.classList.add('hl');
      else el.classList.add('dim');
    }
  });
}

function getConn(id) {
  const s=new Set();
  const m=BYID[id]; if(!m) return s;
  if(m.fid)s.add(m.fid); if(m.mid)s.add(m.mid);
  (m.sp||[]).forEach(sid=>s.add(sid));
  if(FAM) FAM.members.forEach(x=>{if(x.fid===id||x.mid===id)s.add(x.id);});
  return s;
}

/* ── DETAIL PANEL ── */
function openDP(id) {
  const m=BYID[id]; if(!m) return;
  const col=m.familyColor||'#888';
  const ini=((m.first||'?')[0]+((m.sur||'').trim().split(' ').pop()[0]||'')).toUpperCase();
  const fmt=d=>{if(!d)return'—';try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch{return d;}};
  const ageOf=x=>{if(!x.dob)return null;const e=x.dod?new Date(x.dod):new Date();try{return Math.floor((e-new Date(x.dob))/(365.25*24*3600*1e3));}catch{return null;}};
  const father=m.fid?BYID[m.fid]:null;
  const mother=m.mid?BYID[m.mid]:null;
  const a=ageOf(m);
  document.getElementById('dp-hd').innerHTML=`
    <div class="dp-av" style="background:${rgba(col,.18)};color:${col};">${ini}</div>
    <div><div class="dp-nm">${m.first} ${m.sur}</div><div class="dp-sb">${m.familyName} · ${m.alive?'Living':'Deceased'}</div></div>
    <button class="dp-x" onclick="closeDP()">✕</button>`;
  document.getElementById('dp-bd').innerHTML=`
    <div class="dp-r"><span class="dp-lb">Born</span><span class="dp-vl">${fmt(m.dob)}</span></div>
    ${m.dod?`<div class="dp-r"><span class="dp-lb">Died</span><span class="dp-vl">${fmt(m.dod)}</span></div>`
           :`<div class="dp-r"><span class="dp-lb">Age</span><span class="dp-vl">${a?a+' yrs':'—'}</span></div>`}
    <div class="dp-r"><span class="dp-lb">Father</span><span class="dp-vl">${father?father.first+' '+father.sur:'—'}</span></div>
    <div class="dp-r"><span class="dp-lb">Mother</span><span class="dp-vl">${mother?mother.first+' '+mother.sur:'—'}</span></div>
    ${m.branch?`<div class="dp-r"><span class="dp-lb">Branch</span><span class="dp-vl">${m.branch}</span></div>`:''}
    ${m.conf?`<div class="dp-r"><span class="dp-lb">Confidence</span><span class="dp-vl">${m.conf}%</span></div>`:''}`;
  const spouses=(m.sp||[]).map(sid=>BYID[sid]).filter(Boolean);
  const children=FAM?FAM.members.filter(x=>x.fid===id||x.mid===id):[];
  const items=[
    ...spouses.map(s=>`<div class="dp-lk-i" onclick="onCard('${s.id}')"><div class="dp-lk-d" style="background:${s.familyColor||col};"></div>${s.first} ${s.sur}<span class="dp-lk-b">Spouse</span></div>`),
    ...children.map(c=>`<div class="dp-lk-i" onclick="onCard('${c.id}')"><div class="dp-lk-d" style="background:${col};"></div>${c.first} ${c.sur}<span class="dp-lk-b">Child</span></div>`),
  ];
  document.getElementById('dp-lk').innerHTML=items.length?`<div class="dp-lk-t">Connections</div>${items.join('')}`:'';
  document.getElementById('dp').classList.add('open');
}
function closeDP(){selId=null;document.getElementById('dp').classList.remove('open');applyHL();}

/* ── SEARCH ── */
function onSearch(v) {
  searchQ=v.trim().toLowerCase(); selId=null; closeDP();
  if (searchQ) {
    const match=FAMILIES.find(f=>f.name.toLowerCase().includes(searchQ));
    if (match&&(!FAM||FAM.id!==match.id)) selectFam(match.id);
    else applyHL();
  } else applyHL();
}

/* ── CLICK OUTSIDE ── */
document.addEventListener('click',e=>{
  if(!e.target.closest('.pcard')&&!e.target.closest('.dp')&&!e.target.closest('.couple-wrap')) closeDP();
});

init();
selectFam('F001');
</script>
